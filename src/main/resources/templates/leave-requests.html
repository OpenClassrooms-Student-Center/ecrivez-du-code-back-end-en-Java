<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="api-base" th:content="@{/api/}">
    <title>Hamac</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <script type="module" th:src="@{/js/app.js}" src="/js/app.js"></script>
</head>
<body>
<header>
    <h1>Hamac</h1>
    <label>
        <span data-i18n="language">Langue</span>
        <select id="language">
            <option value="fr">Français</option>
            <option value="en">English</option>
        </select>
    </label>
</header>

<main>
    <p>Données au <span th:text="${today}">01/01/2026</span></p>

    <section>
        <h2 data-i18n="balanceTitle">Solde de congés</h2>
        <form id="balance-form">
            <label><span data-i18n="employeeNumber">Numéro de salarié</span>
                <input id="balance-employee" type="number" min="1" value="1" required>
            </label>
            <button type="submit" data-i18n="show">Afficher</button>
        </form>
        <p id="balance"></p>
    </section>

    <section>
        <h2 data-i18n="requestsTitle">Demandes de congés</h2>
        <label><span data-i18n="filter">Filtrer par statut</span>
            <select id="status-filter">
                <option value="" data-i18n="all">Toutes</option>
                <option value="Pending" data-i18n="Pending">En attente</option>
                <option value="Approved" data-i18n="Approved">Approuvée</option>
                <option value="Refused" data-i18n="Refused">Refusée</option>
            </select>
        </label>
        <table>
            <thead>
            <tr>
                <th>N°</th>
                <th data-i18n="employee">Salarié</th>
                <th data-i18n="start">Début</th>
                <th data-i18n="end">Fin</th>
                <th data-i18n="days">Jours</th>
                <th data-i18n="status">Statut</th>
                <th data-i18n="actions">Actions</th>
            </tr>
            </thead>
            <tbody id="requests"></tbody>
        </table>
    </section>

    <section>
        <h2 data-i18n="newRequest">Nouvelle demande</h2>
        <form id="request-form">
            <label><span data-i18n="employeeNumber">Numéro de salarié</span>
                <input name="employeeId" type="number" min="1" required>
            </label>
            <label><span data-i18n="start">Début</span> <input name="startDate" type="date" required></label>
            <label><span data-i18n="end">Fin</span> <input name="endDate" type="date" required></label>
            <button type="submit" data-i18n="submit">Déposer</button>
        </form>
    </section>

    <p id="error" class="error" role="alert"></p>
</main>
</body>
</html>
